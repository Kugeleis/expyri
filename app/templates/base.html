<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>ExPyRi — Experiment Evaluation Wizard</title>
        <script>
            (function () {
                try {
                    const storedTheme = localStorage.getItem('expyri-theme');
                    if (storedTheme === 'light' || storedTheme === 'dark') {
                        document.documentElement.dataset.theme = storedTheme;
                        document.cookie = `expyri_theme=${storedTheme}; path=/; max-age=31536000; SameSite=Lax`;
                    }
                } catch {
                    document.documentElement.dataset.theme = document.documentElement.dataset.theme || 'dark';
                }
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@anyblades/pico@2.2.0-beta/css/pico.blades.min.css" />
        <link rel="stylesheet" href="/static/style.css" />
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    </head>
    <body hx-headers='{"HX-Request": "true"}'>
        <div class="glow-container">
            <div class="glow-circle glow-1"></div>
            <div class="glow-circle glow-2"></div>
        </div>

        <div class="app-container">
            <!-- Sidebar Navigation -->
            <aside class="sidebar">
                <div class="logo">
                    <span class="icon">📊</span>
                    <h1>ExPyRi</h1>
                    <span class="app-version">v{{ app_version }}</span>
                </div>

                {% include "partials/session_info.html" %}
                {% include "partials/sidebar_actions.html" %}
                {% include "partials/steps_nav.html" %}
                <div class="theme-toggle-wrapper">
                    <button
                        type="button"
                        class="theme-toggle"
                        id="theme-toggle"
                        aria-label="Switch to light mode"
                        title="Switch to light mode"
                    >
                        <svg class="theme-toggle-icon theme-toggle-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2"></path>
                            <path d="M12 20v2"></path>
                            <path d="m4.93 4.93 1.41 1.41"></path>
                            <path d="m17.66 17.66 1.41 1.41"></path>
                            <path d="M2 12h2"></path>
                            <path d="M20 12h2"></path>
                            <path d="m6.34 17.66-1.41 1.41"></path>
                            <path d="m19.07 4.93-1.41 1.41"></path>
                        </svg>
                        <svg class="theme-toggle-icon theme-toggle-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
                            <path d="M20.99 12.73A8.5 8.5 0 1 1 11.27 3a6.5 6.5 0 0 0 9.72 9.72Z"></path>
                        </svg>
                    </button>
                </div>
            </aside>

            <!-- Main Workspace -->
            <main class="main-content">
                <header class="main-header">
                    <h2>Experiment Evaluation Wizard</h2>
                    <button class="outline secondary btn-restart"
                            hx-post="/wizard/sessions/{{ session.session_id }}/restart"
                            hx-target="body"
                            hx-confirm="Are you sure you want to start a new session? All configuration will be lost.">
                        New Session
                    </button>
                </header>

                <article class="card-workspace" id="workspace-container">
                    {% include "partials/workspace.html" %}
                </article>
            </main>
        </div>

        <!-- Error Toast (HTMX Error handling) -->
        <div class="toast hidden" id="error-toast">
            <span class="toast-icon">❌</span>
            <span class="toast-message" id="toast-msg">An error occurred</span>
            <button class="toast-close" id="toast-close" type="button">&times;</button>
        </div>

        <script>
            // Simple HTMX error handler
            document.body.addEventListener('htmx:responseError', function(evt) {
                const errorToast = document.getElementById('error-toast');
                const toastMsg = document.getElementById('toast-msg');
                if (errorToast && toastMsg) {
                    try {
                        const detail = JSON.parse(evt.detail.xhr.responseText);
                        toastMsg.textContent = detail.detail || "An error occurred";
                    } catch(e) {
                        toastMsg.textContent = evt.detail.xhr.responseText || "An error occurred";
                    }
                    errorToast.classList.remove('hidden');
                    setTimeout(() => {
                        errorToast.classList.add('hidden');
                    }, 5000);
                }
            });

            const toastClose = document.getElementById('toast-close');
            if (toastClose) {
                toastClose.addEventListener('click', function() {
                    const errorToast = document.getElementById('error-toast');
                    if (errorToast) {
                        errorToast.classList.add('hidden');
                    }
                });
            }

            // Preserve scroll position of step panels during HTMX swap
            let activePanelScrollTop = 0;
            function restoreActivePanelScroll() {
                const activePanel = document.querySelector('.step-panel.active');
                if (activePanel) {
                    activePanel.scrollTop = activePanelScrollTop;
                }
            }
            document.body.addEventListener('htmx:beforeRequest', function(evt) {
                const activePanel = document.querySelector('.step-panel.active');
                if (activePanel) {
                    activePanelScrollTop = activePanel.scrollTop || activePanelScrollTop;
                }
            });
            document.body.addEventListener('htmx:afterSwap', function(evt) {
                restoreActivePanelScroll();
            });
            document.body.addEventListener('htmx:afterSettle', function(evt) {
                requestAnimationFrame(restoreActivePanelScroll);
            });
            document.body.addEventListener('scroll', function(evt) {
                if (evt.target && evt.target.classList && evt.target.classList.contains('step-panel')) {
                    activePanelScrollTop = evt.target.scrollTop;
                }
            }, true);
        </script>
        <script src="/static/app.js" defer></script>
        <script type="module" src="/static/pacman.js" defer></script>
    </body>
</html>
