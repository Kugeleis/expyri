# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml", args = ["--unsafe"] },
  { id = "check-added-large-files" }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.0"
hooks = [
  { id = "ruff", args = ["--fix"] },
  { id = "ruff-format" }
]

# ty has no official pre-commit hook repository yet, so run it via uv directly.
[[repos]]
repo = "local"
hooks = [
  { id = "ty", name = "ty type checker", entry = "uv run ty check app", language = "system", pass_filenames = false }
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "v4.0.0-alpha.8"
hooks = [
  { id = "prettier", types_or = ["javascript", "css", "html"], exclude = "^docs/", args = ["--no-error-on-unmatched-pattern"] }
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-eslint"
rev = "v10.12.0"
hooks = [
  { id = "eslint", files = '\.[jt]sx?$', exclude = "^docs/", types = ["file"], args = ["--quiet"], additional_dependencies = ["eslint@9.16.0"] }
]
